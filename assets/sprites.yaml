# Pose sets for the pet. Images live in assets/sprites/<sheet>/<nn>.png
# (generated by tools/slice_sheets.py; nn is the row-major cell index).
#
# sheets.<name>.scale normalises each sheet so a standing pose is the same
# on-screen height; pose_scale overrides individual poses (e.g. half-body framings).
#
# Activity fields:
#   poses      list of "<sheet>/<nn>"
#   mode       loop (cycle until the state changes) | oneshot (play in order once)
#   hold       [min, max] seconds each pose is held
#   motion     breathe | bob | dance | walk | none
#   ambient    true → eligible for random ambient gestures while idle;
#              coding / browsing → picked instead while you're coding / browsing
#   fallback   activity to use while this one has no poses yet

reference_height: 380

sheets:
  generic_a: {scale: 1.05}
  generic_b: {scale: 1.0}
  music: {scale: 0.93}
  laptop: {scale: 0.95}
  coffee:
    scale: 1.0
    # Rows 2-4 are half-body framings drawn larger.
    pose_scale: {"04": 0.75, "05": 0.75, "06": 0.75, "07": 0.75, "08": 0.75, "09": 0.75,
                 "10": 0.75, "11": 0.75, "12": 0.75, "13": 0.75, "14": 0.75, "15": 0.75}
  weather: {scale: 0.93}
  ai: {scale: 0.65}  # upper-body framing, drawn larger
  stress: {scale: 1.1}
  coding: {scale: 1.1}
  browsing: {scale: 1.1}
  vape: {scale: 1.0}

activities:
  idle:
    poses: [generic_a/00, generic_b/00, generic_b/08, generic_a/08]
    mode: loop
    hold: [5, 10]
    motion: breathe

  # --- Ambient gestures (generic sheets only) ---
  wave:
    poses: [generic_a/03]
    mode: oneshot
    hold: [2, 3]
    motion: breathe
    ambient: true
  finger_guns:
    poses: [generic_a/04, generic_b/07]
    mode: oneshot
    hold: [1.5, 2]
    motion: bob
    ambient: true
  stretch:
    poses: [generic_a/05]
    mode: oneshot
    hold: [2, 3]
    motion: breathe
    ambient: true
  crouch:
    poses: [generic_a/06]
    mode: oneshot
    hold: [3, 5]
    motion: breathe
    ambient: true
  think:
    poses: [generic_b/02]
    mode: oneshot
    hold: [3, 5]
    motion: breathe
    ambient: true
  sit:
    poses: [generic_b/03]
    mode: oneshot
    hold: [6, 12]
    motion: breathe
    ambient: true
  flex:
    poses: [generic_b/04]
    mode: oneshot
    hold: [1.5, 2.5]
    motion: bob
    ambient: true
  surprised:
    poses: [generic_b/06]
    mode: oneshot
    hold: [1.5, 2.5]
    motion: none

  walk:
    poses: [generic_a/01, generic_a/02, generic_a/07, generic_a/02]
    mode: oneshot
    hold: [0.35, 0.35]
    motion: walk

  reminder:  # something on the calendar is coming up
    poses: [generic_b/06, generic_b/02]
    mode: oneshot
    hold: [1.5, 2.5]
    motion: none

  greet:
    poses: [generic_b/01]
    mode: oneshot
    hold: [2, 2.5]
    motion: breathe

  celebrate:
    poses: [generic_a/05, generic_b/04, generic_a/04]
    mode: oneshot
    hold: [0.8, 1.0]
    motion: bob

  # --- Music ---
  music_listen:
    poses: [music/00, music/03, music/05, music/07, music/04, browsing/15]  # browsing/15: headphones
    mode: loop
    hold: [3, 6]
    motion: bob
  music_dance:
    poses: [music/01, music/02, music/06, music/08]
    mode: loop
    hold: [0.8, 1.6]
    motion: dance

  # --- Reading email / messages (notifications phase) ---
  reading:
    poses: [laptop/00, laptop/01, laptop/02, laptop/03, laptop/06, laptop/08, laptop/10, laptop/11]
    mode: loop
    hold: [4, 8]
    motion: breathe
  reading_react:
    poses: [laptop/05, laptop/04]
    mode: oneshot
    hold: [1.2, 1.8]
    motion: bob

  # --- Coding (coding sheet) ---
  # Cells: 00 arms crossed, 01 walking in with backpack + laptop, 02 desk with headphones and
  # code screens, 03 hoodie thinking, 04 arms up, 05 hoodie crouched over laptop, 06 terminal mug,
  # 07 leaning back in chair, 08 tablet with code, 09 cross-legged with laptop, 10 walking off,
  # 11 pointing, 12 laptop on lap, 13 rock-on, 14 masked hoodie, 15 reclining with laptop.
  coding:  # typing in an editor/terminal
    poses: [coding/02, coding/09, coding/05, coding/12, coding/08, coding/15]
    mode: loop
    hold: [6, 12]
    motion: breathe
  coding_think:
    poses: [coding/03]
    mode: oneshot
    hold: [3, 5]
    motion: breathe
    ambient: coding
  coding_coffee:
    poses: [coding/06]
    mode: oneshot
    hold: [3, 5]
    motion: breathe
    ambient: coding
  coding_lean_back:
    poses: [coding/07]
    mode: oneshot
    hold: [4, 7]
    motion: breathe
    ambient: coding
  coding_smug:
    poses: [coding/00, coding/11]
    mode: oneshot
    hold: [2, 3]
    motion: breathe
    ambient: coding
  coding_hacker:
    poses: [coding/14]
    mode: oneshot
    hold: [2.5, 3.5]
    motion: breathe
    ambient: coding
  coding_celebrate:  # done/celebrate while coding or working
    poses: [coding/04, coding/13]
    mode: oneshot
    hold: [1.2, 1.8]
    motion: bob

  # --- Browsing (browsing sheet; a browser focused) ---
  # Cells (6 per row): 00 laptop facing out, 01 typing, 02 typing smirk, 03 pleased, 04 "!",
  # 05 "?" chin, 06 coffee, 07 focused typing, 08 lying chin in hand, 09 cheering, 10 "??" head
  # scratch, 11 lightbulb, 12 stifling a laugh, 13 shocked, 14 hmm, 15 headphones (music only), 16 hands behind
  # head, 17 yawning, 18 lying typing, 19 lying with globe bubble, 20 lying typing, 21 lying coffee,
  # 22 lying with hearts, 23 lying typing.
  browsing:
    poses: [browsing/01, browsing/19, browsing/02, browsing/18, browsing/07, browsing/20,
            browsing/00, browsing/23, browsing/03]
    mode: loop
    hold: [6, 12]
    motion: breathe
  browsing_think:
    poses: [browsing/05, browsing/14]
    mode: oneshot
    hold: [2.5, 4]
    motion: breathe
    ambient: browsing
  browsing_confused:
    poses: [browsing/10]
    mode: oneshot
    hold: [2.5, 3.5]
    motion: breathe
    ambient: browsing
  browsing_idea:
    poses: [browsing/11]
    mode: oneshot
    hold: [2, 3]
    motion: bob
    ambient: browsing
  browsing_wow:
    poses: [browsing/04, browsing/13]
    mode: oneshot
    hold: [1.5, 2.5]
    motion: none
    ambient: browsing
  browsing_laugh:
    poses: [browsing/12]
    mode: oneshot
    hold: [2, 3]
    motion: bob
    ambient: browsing
  browsing_coffee:
    poses: [browsing/06, browsing/21]
    mode: oneshot
    hold: [3, 5]
    motion: breathe
    ambient: browsing
  browsing_relax:
    poses: [browsing/16, browsing/08]
    mode: oneshot
    hold: [4, 7]
    motion: breathe
    ambient: browsing
  browsing_love:
    poses: [browsing/22]
    mode: oneshot
    hold: [2.5, 3.5]
    motion: breathe
    ambient: browsing
  browsing_celebrate:  # done/celebrate while browsing
    poses: [browsing/09]
    mode: oneshot
    hold: [1.8, 2.5]
    motion: bob

  # Long sessions (stress sheet). Cells: 00 head in hands at desk, 01 panicking, 02 flopped back,
  # 03 on fire, 04 armful of coffees, 05 hair-pulling at laptop, 06 face-down low battery,
  # 07 to-do list, 08 hugging knees, 09 papers flying, 10 overwhelmed, 11 "Just one more…" mug,
  # 12 rubbing eyes, 13 checking watch, 14 rain cloud, 15 "I'm done…" sign.
  coding_tired:
    poses: [coding/02, stress/11, coding/12, stress/12, coding/09, stress/13, stress/04]
    mode: loop
    hold: [6, 12]
    motion: breathe
  coding_exhausted:
    poses: [stress/11, stress/06, stress/12, stress/02, stress/13, stress/15]
    mode: loop
    hold: [6, 12]
    motion: breathe
  browsing_tired:
    poses: [browsing/17, browsing/01, stress/12, browsing/08, stress/13, browsing/18]
    mode: loop
    hold: [6, 12]
    motion: breathe
  browsing_exhausted:
    poses: [browsing/17, stress/06, stress/12, stress/02, stress/13, stress/15]
    mode: loop
    hold: [6, 12]
    motion: breathe

  usage_low:  # an AI plan window just passed usage.react_at_percent
    poses: [stress/06, stress/13, stress/15]
    mode: oneshot
    hold: [2, 3]
    motion: none

  # --- Tasks (driven by `bench-pet working|done|failed`) ---
  working:
    poses: [coding/02, coding/05, coding/09, coding/08, coding/12]
    mode: loop
    hold: [3, 6]
    motion: breathe
  failed:
    poses: [laptop/07]
    mode: oneshot
    hold: [2.5, 3]
    motion: none
  frustrated:  # second failure in a few minutes
    poses: [stress/05, stress/01]
    mode: oneshot
    hold: [1.8, 2.5]
    motion: none
  meltdown:  # third or more
    poses: [stress/09, stress/03, stress/10]
    mode: oneshot
    hold: [1.8, 2.5]
    motion: none

  # --- Away from the machine (idle phase) ---
  away_short:
    # Vape cells: 00 holding, 01 drawing, 02 exhaling cloud, 05 thinking, 06 wink + thumbs-up,
    # 07 leaning, 08 reclining exhale. (03 and 04 keep dark smoke fringes; left out until
    # the sheet comes with real transparency.)
    poses: [coffee/00, coffee/01, coffee/02, coffee/03, coffee/04, coffee/05, coffee/06, coffee/07,
            coffee/08, coffee/09, coffee/10, coffee/11, coffee/13, coffee/14, coffee/15,
            vape/00, vape/01, vape/02, vape/05, vape/06, vape/07, vape/08]
    mode: loop
    hold: [6, 12]
    motion: breathe
  away_long:
    # Long-absence art (sleeping etc.) not drawn yet.
    poses: []
    mode: loop
    hold: [8, 15]
    motion: breathe
    fallback: away_short

  # --- Weather (reactions + occasional ambient gestures; never a persistent state) ---
  # Cells: 00 sunglasses, 01 umbrella, 02 windswept, 03 beanie/scarf, 04 thunder cloud,
  # 05 sweating, 06 checking forecast, 07 grey cloud on a rock, 08 umbrella blown out,
  # 09 enjoying the rain, 10 snowman. (11 has an opaque background; not sliced.)
  weather_sunny:
    poses: [weather/00]
    mode: oneshot
    hold: [4, 7]
    motion: breathe
  weather_clear_night:  # no night art yet; check the forecast instead
    poses: [weather/06]
    mode: oneshot
    hold: [3, 5]
    motion: breathe
  weather_cloudy:
    poses: [weather/07]
    mode: oneshot
    hold: [5, 8]
    motion: breathe
  weather_rain:
    poses: [weather/01, weather/09]
    mode: oneshot
    hold: [3, 5]
    motion: breathe
  weather_drizzle:
    poses: [weather/09]
    mode: oneshot
    hold: [3, 5]
    motion: breathe
  weather_windy:
    poses: [weather/02]
    mode: oneshot
    hold: [3, 5]
    motion: bob
  weather_windy_rain:
    poses: [weather/08, weather/01]
    mode: oneshot
    hold: [2.5, 4]
    motion: bob
  weather_storm:
    poses: [weather/04]
    mode: oneshot
    hold: [3, 5]
    motion: none
  weather_snow:
    poses: [weather/03, weather/10]
    mode: oneshot
    hold: [3, 5]
    motion: breathe
  weather_hot:
    poses: [weather/05, weather/00]
    mode: oneshot
    hold: [3, 5]
    motion: breathe
  weather_cold:
    poses: [weather/03]
    mode: oneshot
    hold: [4, 6]
    motion: breathe

  # --- Pomodoro ---
  focus:
    poses: [laptop/06, laptop/01, laptop/02, laptop/00]
    mode: loop
    hold: [6, 12]
    motion: breathe
  pomodoro_break:
    poses: [coffee/00, coffee/01, coffee/02, coffee/03, coffee/06, coffee/07, coffee/09,
            coffee/10, coffee/11, coffee/13, vape/00, vape/01, vape/02, vape/05, vape/07]
    mode: loop
    hold: [5, 9]
    motion: breathe
  tired:  # focus session over
    poses: [laptop/07, coffee/12]
    mode: oneshot
    hold: [2, 3]
    motion: none
  refreshed:  # break over, back to it
    poses: [generic_a/05, coffee/15]
    mode: oneshot
    hold: [1.8, 2.5]
    motion: bob

  # --- AI agents (speech bubble with the agent's reply) ---
  # Cells: 00 laptop + ChatGPT bubble, 01 ChatGPT tablet thumbs-up, 02 thinking + Claude bubble,
  # 03 laptop + Claude bubble, 04 hugging both logos, 05 "Got a message from AI",
  # 06 desk with both logos, 07 cheering under both, 08 beanbag "ChatGPT …", 09 "Claude …",
  # 10 mug + thought bubble, 11 "Better together" thumbs-up.
  ai_message:  # a reply just arrived
    poses: [ai/05]
    mode: oneshot
    hold: [2, 2.5]
    motion: bob
  agent_claude:  # showing Claude's reply
    poses: [ai/03, ai/02]
    mode: loop
    hold: [5, 8]
    motion: breathe
  agent_codex:
    poses: [ai/00, ai/01]
    mode: loop
    hold: [5, 8]
    motion: breathe
  agent_chatgpt:
    poses: [ai/00, ai/08, ai/01]
    mode: loop
    hold: [5, 8]
    motion: breathe
  agent_generic:
    poses: [ai/06, ai/10, ai/04]
    mode: loop
    hold: [5, 8]
    motion: breathe
  agent_claude_working:  # `bench-pet working Claude`
    poses: [ai/09, ai/02]
    mode: loop
    hold: [4, 7]
    motion: breathe
  agent_codex_working:
    poses: [ai/08, ai/00]
    mode: loop
    hold: [4, 7]
    motion: breathe
